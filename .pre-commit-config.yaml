# Run with prek (or pre-commit). Enable once per clone: prek install
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.15
    hooks:
      - id: biome-check
        additional_dependencies: ['@biomejs/biome@2.5.15']
  - repo: local
    hooks:
      - id: test
        name: node test.js
        entry: node test.js
        language: system
        files: \.(js|html)$
        pass_filenames: false
